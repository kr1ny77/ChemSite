name: Windows native smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-play:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install official Godot 4.7.2 editor and export templates
        shell: pwsh
        run: |
          $version = '4.7.2-stable'
          $base = "https://github.com/godotengine/godot/releases/download/$version"
          Invoke-WebRequest "$base/Godot_v${version}_win64.exe.zip" -OutFile godot-editor.zip
          Expand-Archive godot-editor.zip -DestinationPath godot-editor
          $editor = Get-ChildItem godot-editor -Filter 'Godot_v4.7.2-stable_win64.exe' -Recurse | Select-Object -First 1
          if ($null -eq $editor) { throw 'Official Windows editor missing from archive' }
          "GODOT_EXE=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Invoke-WebRequest "$base/Godot_v${version}_export_templates.tpz" -OutFile godot-templates.zip
          Expand-Archive godot-templates.zip -DestinationPath godot-templates
          $templateDir = Join-Path $env:APPDATA 'Godot/export_templates/4.7.2.stable'
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Copy-Item 'godot-templates/templates/*' $templateDir -Recurse -Force
          if (-not (Test-Path (Join-Path $templateDir 'windows_release_x86_64.exe'))) { throw 'Windows export template missing' }
      - name: Import and export Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/native-qa' | Out-Null
          $importOut = 'artifacts/native-qa/editor-import.stdout.log'
          $importErr = 'artifacts/native-qa/editor-import.stderr.log'
          $import = Start-Process -FilePath $env:GODOT_EXE -ArgumentList @('--headless', '--path', '.', '--editor', '--import') -Wait -PassThru -RedirectStandardOutput $importOut -RedirectStandardError $importErr
          Get-Content $importOut, $importErr | Write-Host
          if ($import.ExitCode -ne 0 -or (Select-String -Path $importOut, $importErr -Pattern 'SCRIPT ERROR:|(^|\s)ERROR:' -Quiet)) { throw "Godot import failed or reported an engine/script error ($($import.ExitCode))" }
          New-Item -ItemType Directory -Force -Path 'artifacts/native-qa' | Out-Null
          $checks = @(
            @{ Script = 'player_grounding_smoke'; Marker = 'PLAYER_GROUNDING_SMOKE_OK' }
            @{ Script = 'locomotion_transition_smoke'; Marker = 'LOCOMOTION_TRANSITION_SMOKE_OK' }
            @{ Script = 'footstep_timing_smoke'; Marker = 'FOOTSTEP_TIMING_SMOKE_OK' }
            @{ Script = 'turn_response_smoke'; Marker = 'TURN_RESPONSE_SMOKE_OK' }
            @{ Script = 'measure_locomotion_contact'; Marker = 'LOCOMOTION_CONTACT_DIAGNOSTIC_OK' }
            @{ Script = 'player_visibility_smoke'; Marker = 'PLAYER_VISIBILITY_SMOKE_OK' }
            @{ Script = 'sample_bench_smoke'; Marker = 'SAMPLE_BENCH_SMOKE_OK' }
            @{ Script = 'water_bay_smoke'; Marker = 'WATER_BAY_SMOKE_OK' }
            @{ Script = 'movement_easing_smoke'; Marker = 'MOVEMENT_EASING_SMOKE_OK' }
            @{ Script = 'station_wayfinder_smoke'; Marker = 'STATION_WAYFINDER_SMOKE_OK' }
            @{ Script = 'mixing_visual_smoke'; Marker = 'MIXING_VISUAL_SMOKE_OK' }
            @{ Script = 'ph_scale_smoke'; Marker = 'PH_SCALE_SMOKE_OK' }
            @{ Script = 'comparison_visual_smoke'; Marker = 'COMPARISON_VISUAL_SMOKE_OK' }
            @{ Script = 'mixer_motion_smoke'; Marker = 'CHEMSITE_MIXER_MOTION_OK' }
            @{ Script = 'construction_progress_smoke'; Marker = 'CHEMSITE_CONSTRUCTION_PROGRESS_OK' }
            @{ Script = 'focus_pause_smoke'; Marker = 'FOCUS_PAUSE_SMOKE_OK' }
            @{ Script = 'choice_order_smoke'; Marker = 'CHOICE_ORDER_SMOKE_OK' }
            @{ Script = 'career_history_smoke'; Marker = 'CAREER_HISTORY_SMOKE_OK' }
            @{ Script = 'course_integration_smoke'; Marker = 'COURSE_INTEGRATION_OK' }
            @{ Script = 'learning_materials_smoke'; Marker = 'LEARNING_MATERIALS_SMOKE_OK' }
            @{ Script = 'study_audio_smoke'; Marker = 'STUDY_AUDIO_SMOKE_OK' }
          )
          foreach ($check in $checks) {
            $log = "artifacts/native-qa/$($check.Script).log"
            $test = Start-Process -FilePath $env:GODOT_EXE -ArgumentList @('--headless', '--path', '.', '--script', "tools/validation/$($check.Script).gd", '--log-file', $log) -PassThru -NoNewWindow
            if (-not $test.WaitForExit(240000)) {
              Stop-Process -Id $test.Id -Force -ErrorAction SilentlyContinue
              throw "$($check.Script) timed out"
            }
            $test.Refresh()
            if (-not (Test-Path $log)) { throw "$($check.Script) log missing" }
            $text = Get-Content $log -Raw
            Write-Host $text
            if ($test.ExitCode -ne 0 -or $text -notmatch ([regex]::Escape($check.Marker)) -or $text -match '(?m)^(SCRIPT ERROR|ERROR):') {
              throw "$($check.Script) failed or did not reach its success marker ($($test.ExitCode))"
            }
          }
          New-Item -ItemType Directory -Force -Path 'builds/windows' | Out-Null
          $export = Start-Process -FilePath $env:GODOT_EXE -ArgumentList @('--headless', '--path', '.', '--export-release', '"Windows Desktop"', 'builds/windows/ChemSite.exe') -Wait -PassThru -NoNewWindow
          if ($export.ExitCode -ne 0) { throw "Godot export failed ($($export.ExitCode))" }
          Get-ChildItem 'builds/windows' | Select-Object Name,Length | Format-Table
          if (-not (Test-Path 'builds/windows/ChemSite.exe')) { throw 'Windows EXE missing' }
          $versionLines = @(Select-String -Path 'project.godot' -Pattern '^config/version="([^"]+)"$')
          if ($versionLines.Count -ne 1) { throw 'Expected one project release version' }
          $expectedVersion = $versionLines[0].Matches[0].Groups[1].Value + '.0'
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'builds/windows/ChemSite.exe').Path)
          if ($versionInfo.FileVersion -ne $expectedVersion -or $versionInfo.ProductVersion -ne $expectedVersion) {
            throw "Windows embedded version mismatch: file=$($versionInfo.FileVersion) product=$($versionInfo.ProductVersion) expected=$expectedVersion"
          }
          @{ file_version = $versionInfo.FileVersion; product_version = $versionInfo.ProductVersion } | ConvertTo-Json | Set-Content 'artifacts/native-qa/windows-version.json'
          Write-Host "WINDOWS_EMBEDDED_VERSION_OK $expectedVersion"
          if (-not (Test-Path 'builds/windows/ChemSite.pck')) { throw 'Windows PCK missing' }
      - name: Verify exported movement in isolated directory
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'builds/windows/ChemSite.exe').Path
          $log = Join-Path (Resolve-Path 'artifacts/native-qa').Path 'packaged-movement.log'
          $isolated = Join-Path $env:RUNNER_TEMP 'chemsite-movement-qa'
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          $process = Start-Process -FilePath $exe -WorkingDirectory $isolated -ArgumentList @('--headless', '--log-file', ('"' + $log + '"'), '--', '--qa-movement') -PassThru
          if (-not $process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged movement timed out'
          }
          $process.Refresh()
          $text = Get-Content $log -Raw
          Write-Host $text
          $version = (Select-String -Path 'project.godot' -Pattern '^config/version="([^"]+)"$').Matches[0].Groups[1].Value
          if ($process.ExitCode -ne 0 -or $text -notmatch ([regex]::Escape("PACKAGED_MOVEMENT_SMOKE_OK version=$version ")) -or $text -match '(?m)^(SCRIPT ERROR|ERROR):') {
            throw "Packaged movement failed ($($process.ExitCode))"
          }
      - name: Verify exported study audio events
        shell: pwsh
        run: |
          $log = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'study-audio.log')
          $exe = (Resolve-Path 'builds/windows/ChemSite.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--headless', '--log-file', ('"' + $log + '"'), '--', '--qa-study-audio') -PassThru -NoNewWindow
          if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id -Force; throw 'Study audio timed out' }
          $process.Refresh()
          $text = Get-Content $log -Raw
          Write-Host $text
          if ($process.ExitCode -ne 0 -or $text -notmatch 'STUDY_AUDIO_SMOKE_OK' -or $text -match '(?m)^(SCRIPT ERROR|ERROR):') { throw 'Packaged study audio failed' }
      - name: Run native five-level gameplay smokes
        shell: pwsh
        run: |
          function Assert-CleanLog($path) {
            $text = Get-Content $path -Raw
            Write-Host $text
            if ($text -match '(?m)^(SCRIPT ERROR|ERROR):|ObjectDB instances leaked') { throw "Engine shutdown/runtime error in $path" }
          }
          foreach ($level in 1..5) {
            $flag = if ($level -eq 1) { '--qa-round' } else { "--qa-level$level-round" }
            $roundLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path "round-$level.log")
            $round = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $roundLog + '"'), '--', $flag) -Wait -PassThru -NoNewWindow
            Assert-CleanLog $roundLog
            if ($round.ExitCode -ne 0) { throw "Level $level packaged smoke failed ($($round.ExitCode))" }
          }
          $courseLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'course-rounds.log')
          $course = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $courseLog + '"'), '--', '--qa-course') -PassThru -NoNewWindow
          if (-not $course.WaitForExit(120000)) { Stop-Process -Id $course.Id -Force; throw 'Course rounds timed out' }
          $course.Refresh()
          $courseText = Get-Content $courseLog -Raw
          Write-Host $courseText
          if ($course.ExitCode -ne 0 -or $courseText -notmatch 'COURSE_ROUNDS_SMOKE_OK' -or $courseText -match '(?m)^(SCRIPT ERROR|ERROR):') { throw 'Course rounds failed' }
          $practiceLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'practice.log')
          $practice = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $practiceLog + '"'), '--', '--qa-practice-levels') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $practiceLog
          if ($practice.ExitCode -ne 0) { throw "Five-level practice smoke failed ($($practice.ExitCode))" }
          $missionLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'mission.log')
          $mission = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $missionLog + '"'), '--', '--qa-level5-mission-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $missionLog
          if ($mission.ExitCode -ne 0) { throw "Level 5 mission smoke failed ($($mission.ExitCode))" }
          $inspectionsLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'inspections.log')
          $inspections = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $inspectionsLog + '"'), '--', '--qa-site-inspections') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $inspectionsLog
          if ($inspections.ExitCode -ne 0) { throw "Site inspection smoke failed ($($inspections.ExitCode))" }
          $scalesLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'scales.log')
          $scales = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $scalesLog + '"'), '--', '--qa-level3-scale-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $scalesLog
          if ($scales.ExitCode -ne 0) { throw "Level 3 scale smoke failed ($($scales.ExitCode))" }
          $solutionLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'solution.log')
          $solution = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $solutionLog + '"'), '--', '--qa-level3-solution-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $solutionLog
          if ($solution.ExitCode -ne 0) { throw "Level 3 solution smoke failed ($($solution.ExitCode))" }
          $phLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'ph.log')
          $ph = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $phLog + '"'), '--', '--qa-level3-ph-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $phLog
          if ($ph.ExitCode -ne 0) { throw "Level 3 pH smoke failed ($($ph.ExitCode))" }
          $ionsLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'ions.log')
          $ions = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $ionsLog + '"'), '--', '--qa-level3-ion-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $ionsLog
          if ($ions.ExitCode -ne 0) { throw "Level 3 ion scan smoke failed ($($ions.ExitCode))" }
          $hydrolysisLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'hydrolysis.log')
          $hydrolysis = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $hydrolysisLog + '"'), '--', '--qa-level3-hydrolysis-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $hydrolysisLog
          if ($hydrolysis.ExitCode -ne 0) { throw "Level 3 hydrolysis smoke failed ($($hydrolysis.ExitCode))" }
          $dissociationLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'dissociation.log')
          $dissociation = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $dissociationLog + '"'), '--', '--qa-level3-dissociation-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $dissociationLog
          if ($dissociation.ExitCode -ne 0) { throw "Level 3 dissociation smoke failed ($($dissociation.ExitCode))" }
          $hessLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'hess.log')
          $hess = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $hessLog + '"'), '--', '--qa-level4-hess-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $hessLog
          if ($hess.ExitCode -ne 0) { throw "Level 4 Hess smoke failed ($($hess.ExitCode))" }
          $kineticsLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'kinetics.log')
          $kinetics = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $kineticsLog + '"'), '--', '--qa-level4-kinetics-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $kineticsLog
          if ($kinetics.ExitCode -ne 0) { throw "Level 4 kinetics smoke failed ($($kinetics.ExitCode))" }
          $thermalLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'thermal.log')
          $thermal = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $thermalLog + '"'), '--', '--qa-level4-thermal-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $thermalLog
          if ($thermal.ExitCode -ne 0) { throw 'Level 4 thermal round failed' }
          $equilibriumLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'equilibrium.log')
          $equilibrium = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $equilibriumLog + '"'), '--', '--qa-level4-equilibrium-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $equilibriumLog
          if ($equilibrium.ExitCode -ne 0) { throw "Level 4 equilibrium smoke failed ($($equilibrium.ExitCode))" }
          $electrodesLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'electrodes.log')
          $electrodes = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $electrodesLog + '"'), '--', '--qa-level4-electrode-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $electrodesLog
          if ($electrodes.ExitCode -ne 0) { throw "Level 4 electrode smoke failed ($($electrodes.ExitCode))" }
          $corrosionLog = (Join-Path (Resolve-Path 'artifacts/native-qa').Path 'corrosion.log')
          $corrosion = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--headless', '--log-file', ('"' + $corrosionLog + '"'), '--', '--qa-level4-corrosion-round') -Wait -PassThru -NoNewWindow
          Assert-CleanLog $corrosionLog
          if ($corrosion.ExitCode -ne 0) { throw "Level 4 corrosion smoke failed ($($corrosion.ExitCode))" }
      - name: Verify packaged keyboard event rounds
        shell: pwsh
        run: |
          $qaRoot = (Resolve-Path 'artifacts/native-qa').Path
          foreach ($level in 1..5) {
            $log = Join-Path $qaRoot "keyboard-level$level.log"
            $stdout = "artifacts/native-qa/keyboard-level$level.stdout.log"
            $stderr = "artifacts/native-qa/keyboard-level$level.stderr.log"
            $logArgument = '"' + $log + '"'
            $keyboard = Start-Process -FilePath (Resolve-Path 'builds/windows/ChemSite.exe') -ArgumentList @('--verbose', '--headless', '--log-file', $logArgument, '--', '--qa-keyboard-round', "--qa-keyboard-level=$level") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $keyboard.WaitForExit(150000)) {
              Stop-Process -Id $keyboard.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged keyboard level $level timed out"
            }
            $keyboard.Refresh()
            $text = @($log, $stdout, $stderr) | Where-Object { Test-Path $_ } | ForEach-Object { Get-Content $_ -Raw }
            $text = $text -join "`n"
            Write-Host $text
            if ($keyboard.ExitCode -ne 0 -or $text -notmatch "KEYBOARD_ROUND_SMOKE_OK level=$level" -or $text -match '(?m)^(SCRIPT ERROR|ERROR):') {
              throw "Packaged keyboard level $level failed (exit $($keyboard.ExitCode))"
            }
          }
      - name: Upload native QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChemSite-Windows-native-QA-logs
          path: artifacts/native-qa/
          if-no-files-found: warn
      - name: Upload verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ChemSite-Windows-x86_64
          path: |
            builds/windows/ChemSite.exe
            builds/windows/ChemSite.pck
          if-no-files-found: error
