name: Windows visual QA

on:
  push:
    paths:
      - .github/workflows/windows-visual-qa.yml
      - scripts/ui/**
      - scripts/core/**
      - scripts/qa/**
      - scripts/player/**
      - tools/validation/**
      - scenes/**
      - assets/models/**
      - data/chemistry/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-native-window:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install official Godot 4.7.2 editor and export templates
        shell: pwsh
        run: |
          $version = '4.7.2-stable'
          $base = "https://github.com/godotengine/godot/releases/download/$version"
          Invoke-WebRequest "$base/Godot_v${version}_win64.exe.zip" -OutFile godot-editor.zip
          Expand-Archive godot-editor.zip -DestinationPath godot-editor
          $editor = Get-ChildItem godot-editor -Filter 'Godot_v4.7.2-stable_win64.exe' -Recurse | Select-Object -First 1
          if ($null -eq $editor) { throw 'Official Windows editor missing' }
          "GODOT_EXE=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Invoke-WebRequest "$base/Godot_v${version}_export_templates.tpz" -OutFile godot-templates.zip
          Expand-Archive godot-templates.zip -DestinationPath godot-templates
          $templateDir = Join-Path $env:APPDATA 'Godot/export_templates/4.7.2.stable'
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Copy-Item 'godot-templates/templates/*' $templateDir -Recurse -Force
      - name: Export Windows release
        shell: pwsh
        run: |
          $import = Start-Process -FilePath $env:GODOT_EXE -ArgumentList @('--headless', '--path', '.', '--editor', '--quit') -Wait -PassThru -NoNewWindow
          if ($import.ExitCode -ne 0) { throw "Godot import failed ($($import.ExitCode))" }
          New-Item -ItemType Directory -Force -Path 'builds/windows' | Out-Null
          $export = Start-Process -FilePath $env:GODOT_EXE -ArgumentList @('--headless', '--path', '.', '--export-release', '"Windows Desktop"', 'builds/windows/ChemSite.exe') -Wait -PassThru -NoNewWindow
          if ($export.ExitCode -ne 0) { throw "Windows export failed ($($export.ExitCode))" }
      - name: Capture graphical career and focused interaction rounds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/windows-visual/logs' | Out-Null
          function Invoke-VisualCheck([string]$name, [string]$executable, [string[]]$arguments, [int]$timeoutSeconds = 180) {
            Write-Host "Starting graphical QA: $name"
            $stdout = "artifacts/windows-visual/logs/$name.stdout.log"
            $stderr = "artifacts/windows-visual/logs/$name.stderr.log"
            $process = Start-Process -FilePath $executable -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit($timeoutSeconds * 1000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue | Write-Host
              throw "$name graphical QA timed out after $timeoutSeconds seconds"
            }
            $process.Refresh()
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue | Write-Host
            if ($process.ExitCode -ne 0) { throw "$name graphical QA failed ($($process.ExitCode))" }
            Write-Host "Completed graphical QA: $name"
          }
          Invoke-VisualCheck 'all-hud-layouts' $env:GODOT_EXE @('--path', '.', '--rendering-method', 'gl_compatibility', '--resolution', '1028x642', '--script', 'tools/validation/all_hud_layout_smoke.gd')
          foreach ($check in @('settings_ui_smoke.gd', 'reduced_motion_smoke.gd')) {
            Invoke-VisualCheck $check $env:GODOT_EXE @('--path', '.', '--rendering-method', 'gl_compatibility', '--resolution', '1028x642', '--script', "tools/validation/$check")
          }
          $exe = (Resolve-Path 'builds/windows/ChemSite.exe').Path
          $rounds = @(
            @{ Name = 'level1'; Flag = '--qa-visual-round'; Folder = 'qa-visual-round' }
            @{ Name = 'level2'; Flag = '--qa-visual-level2-round'; Folder = 'qa-visual-level2-round' }
            @{ Name = 'level3'; Flag = '--qa-visual-level3-round'; Folder = 'qa-visual-level3-round' }
            @{ Name = 'level4'; Flag = '--qa-visual-level4-round'; Folder = 'qa-visual-level4-round' }
            @{ Name = 'level5'; Flag = '--qa-visual-level5-round'; Folder = 'qa-visual-level5-round' }
            @{ Name = 'level3-ph'; Flag = '--qa-visual-level3-ph-round'; Folder = 'qa-visual-level3-round-mission' }
            @{ Name = 'level3-ion'; Flag = '--qa-visual-level3-ion-round'; Folder = 'qa-visual-level3-round-mission' }
            @{ Name = 'level3-hydrolysis'; Flag = '--qa-visual-level3-hydrolysis-round'; Folder = 'qa-visual-level3-round-mission' }
            @{ Name = 'level3-dissociation'; Flag = '--qa-visual-level3-dissociation-round'; Folder = 'qa-visual-level3-round-mission' }
            @{ Name = 'level4-hess'; Flag = '--qa-visual-level4-hess-round'; Folder = 'qa-visual-level4-round-mission' }
            @{ Name = 'level4-kinetics'; Flag = '--qa-visual-level4-kinetics-round'; Folder = 'qa-visual-level4-round-mission' }
            @{ Name = 'level4-equilibrium'; Flag = '--qa-visual-level4-equilibrium-round'; Folder = 'qa-visual-level4-round-mission' }
            @{ Name = 'level4-electrode'; Flag = '--qa-visual-level4-electrode-round'; Folder = 'qa-visual-level4-round-mission' }
            @{ Name = 'level4-corrosion'; Flag = '--qa-visual-level4-corrosion-round'; Folder = 'qa-visual-level4-round-mission' }
          )
          foreach ($round in $rounds) {
            Invoke-VisualCheck $round.Name $exe @('--rendering-method', 'gl_compatibility', '--', $round.Flag) 90
            $captures = Get-ChildItem (Join-Path $env:APPDATA 'Godot/app_userdata') -Recurse -Filter 'task_01.png' -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq $round.Folder }
            if (-not $captures) { throw "$($round.Name) graphical QA screenshot missing" }
            $destination = "artifacts/windows-visual/$($round.Name)"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item (Join-Path $captures[0].DirectoryName '*.png') $destination
            $screens = Get-ChildItem $destination -Filter '*.png'
            if ($screens.Count -ne 11) { throw "$($round.Name) expected 11 task/feedback/result screens, found $($screens.Count)" }
            foreach ($screen in $screens) {
              if ($screen.Length -lt 20000) { throw "Capture appears empty: $($screen.Name) ($($screen.Length) bytes)" }
            }
            Write-Host "$($round.Name) captured $($screens.Count) screens"
          }
          $allScreens = @(Get-ChildItem 'artifacts/windows-visual' -Recurse -Filter '*.png')
          if ($allScreens.Count -ne 154) { throw "Expected 154 graphical QA screens, found $($allScreens.Count)" }
      - name: Upload Windows visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChemSite-Windows-visual-QA
          path: artifacts/windows-visual/**/*
          if-no-files-found: warn
